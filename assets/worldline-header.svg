<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Shennoter — Worldline Observer</title>
<desc id="desc">An original Steins;Gate-inspired dark laboratory display. Amber glass tubes read 1.048596, with gently breathing light, a slow rotating calibration ring, and moving worldline signals.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14191e"/><stop offset=".6" stop-color="#101419"/><stop offset="1" stop-color="#1b1815"/></linearGradient>
  <radialGradient id="warm"><stop stop-color="#e58b46" stop-opacity=".13"/><stop offset="1" stop-color="#e58b46" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x2="1" y2="0"><stop stop-color="#ffe0b1" stop-opacity=".06"/><stop offset=".22" stop-color="#ffffff" stop-opacity=".015"/><stop offset=".7" stop-color="#fff0cf" stop-opacity=".035"/><stop offset="1" stop-color="#fcbb77" stop-opacity=".1"/></linearGradient>
  <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#414039"/><stop offset=".5" stop-color="#212421"/><stop offset="1" stop-color="#30322c"/></linearGradient>
  <linearGradient id="scan"><stop stop-color="#e9b977" stop-opacity="0"/><stop offset=".5" stop-color="#e9b977" stop-opacity=".04"/><stop offset="1" stop-color="#e9b977" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0 H0 V30" fill="none" stroke="#ccd6dd" stroke-opacity=".035" stroke-width="1"/></pattern>
  <pattern id="mesh" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="#d4a06a" stroke-opacity=".065" stroke-width=".5"/></pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2"/></filter>
  <clipPath id="bounds"><rect x="1" y="1" width="1198" height="388" rx="18"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,"Cascadia Code",Consolas,"Liberation Mono",monospace}
  .sans{font-family:Arial,Helvetica,sans-serif}
  .breathe{animation:breathe 5s ease-in-out infinite}
  .ring{transform-origin:899px 186px;animation:orbit 100s linear infinite}
  .signal{stroke-dasharray:9 650;animation:signal 12s linear infinite}
  .sweep{animation:sweep 16s linear infinite}
  .led{animation:led 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.78}50%{opacity:1}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes signal{to{stroke-dashoffset:-659}}
  @keyframes sweep{from{transform:translateX(-220px)}to{transform:translateX(1450px)}}
  @keyframes led{0%,100%{opacity:.55}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.breathe,.ring,.signal,.sweep,.led{animation:none!important}}
</style>
